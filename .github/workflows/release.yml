name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run package:macos
        env:
          BUILD_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: CodexUsageStatus-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
